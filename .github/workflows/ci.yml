name: ci

on: push

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          path: docs

      # The path half of the check needs the code these documents describe.
      # No credential is provisioned for it: a token would have to be issued
      # and rotated by a person, and a check that depends on someone
      # remembering to do that is a check that silently stops working. The
      # checkout is attempted without one, which succeeds once the circuits
      # repository is public and is skipped until then.
      - name: check out the circuits repository if it can be read
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: zkICAO/circuits
          path: circuits

      # The script says which checks it ran. Without a circuits checkout it
      # checks the prose and the links between these documents and reports
      # that it did not check the paths, rather than passing over nothing.
      - name: check the documents
        working-directory: docs
        run: |
          if [ -f ../circuits/Nargo.toml ]; then
            python3 tools/check.py ../circuits
          else
            python3 tools/check.py
          fi
